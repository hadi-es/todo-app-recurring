<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App with Recurring Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <div class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
      <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
          <div>
            <h1 class="text-4xl font-bold text-gray-900 dark:text-white">My Tasks</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">Stay organized with recurring tasks</p>
          </div>
          <button id="darkModeToggle" class="p-3 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
          </button>
        </div>

        <!-- Add Todo Form -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 mb-6">
          <div class="space-y-4">
            <input
              type="text"
              id="todoInput"
              placeholder="Add a new task..."
              class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <select id="recurringSelect" class="px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="none">No Repeat</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
              </select>
              <button id="addBtn" class="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg transition-colors">Add Task</button>
            </div>
          </div>
        </div>

        <!-- Filter Tabs -->
        <div class="flex gap-2 mb-6 flex-wrap">
          <button class="filter-btn px-4 py-2 rounded-full font-semibold text-sm transition-colors active" data-filter="all">All</button>
          <button class="filter-btn px-4 py-2 rounded-full font-semibold text-sm transition-colors" data-filter="active">Active</button>
          <button class="filter-btn px-4 py-2 rounded-full font-semibold text-sm transition-colors" data-filter="completed">Completed</button>
          <button class="filter-btn px-4 py-2 rounded-full font-semibold text-sm transition-colors" data-filter="recurring">Recurring</button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 mb-6">
          <div class="bg-blue-50 dark:bg-blue-900/20 rounded-lg p-4 text-center">
            <p class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="totalCount">0</p>
            <p class="text-sm text-gray-600 dark:text-gray-400">Total Tasks</p>
          </div>
          <div class="bg-green-50 dark:bg-green-900/20 rounded-lg p-4 text-center">
            <p class="text-2xl font-bold text-green-600 dark:text-green-400" id="completedCount">0</p>
            <p class="text-sm text-gray-600 dark:text-gray-400">Completed</p>
          </div>
          <div class="bg-purple-50 dark:bg-purple-900/20 rounded-lg p-4 text-center">
            <p class="text-2xl font-bold text-purple-600 dark:text-purple-400" id="recurringCount">0</p>
            <p class="text-sm text-gray-600 dark:text-gray-400">Recurring</p>
          </div>
        </div>

        <!-- Todo List -->
        <div id="todoList" class="space-y-2">
          <!-- Todos will be rendered here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12">
          <svg class="w-16 h-16 mx-auto text-gray-300 dark:text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
          </svg>
          <p class="text-gray-400 dark:text-gray-500 text-lg">No tasks yet. Add one to get started!</p>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
